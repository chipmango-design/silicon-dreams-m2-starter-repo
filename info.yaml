# Tiny Tapeout project information
project:
  title:        "Elevator - M2 Parallel Shaft"
  author:       "ChipMango"
  discord:      "your_discord_handle"
  description:  "Hardened elevator state machine with one-hot encoding, input validation, and fault injection harness for Silicon Dreams M2"
  language:     "Verilog"
  clock_hz:     10000000

  # How many tiles your design occupies
  tiles: "1x1"

  # Your top module name - must start with "tt_um_"
  top_module:  "tt_um_chipmango_elevator_m2"

  # List your project's source files here
  # FIX: Use the actual file name
  source_files:
    #- "src/top.v"          # ← Change this to the actual file name
    # OR if your file is named elevator.v:
     - "elevator.v"

# The pinout of your project
pinout:
  # Inputs
  ui[0]: "floor request bit 0"
  ui[1]: "floor request bit 1"
  ui[2]: "floor request bit 2"
  ui[3]: "floor request bit 3"
  ui[4]: "unused"
  ui[5]: "unused"
  ui[6]: "unused"
  ui[7]: "unused"

  # Outputs
  uo[0]: "7-seg segment a"
  uo[1]: "7-seg segment b"
  uo[2]: "7-seg segment c"
  uo[3]: "7-seg segment d"
  uo[4]: "7-seg segment e"
  uo[5]: "7-seg segment f"
  uo[6]: "7-seg segment g"
  uo[7]: "idle indicator"

  # Bidirectional pins
  uio[0]: "not connected"
  uio[1]: "not connected"
  uio[2]: "not connected"
  uio[3]: "not connected"
  uio[4]: "not connected"
  uio[5]: "not connected"
  uio[6]: "not connected"
  uio[7]: "error LED"

# Do not change!
yaml_version: 6
